<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZORA Creators Memory Game</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,system-ui}

body{
background:radial-gradient(circle at top,#140b2e,#05070d 70%);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
min-height:100vh;
color:white;
padding:40px 0;
}

.app{
width:720px;
max-width:92vw;
aspect-ratio:1/1;
border-radius:28px;
padding:26px 28px 28px 28px;
background:linear-gradient(145deg,#0f1026,#0a0f20);
box-shadow:
0 0 60px rgba(170,80,255,.25),
0 0 120px rgba(0,255,170,.15);
display:flex;
flex-direction:column;
gap:18px;
border:1px solid rgba(180,120,255,.25);
margin:auto;
}
}

.header{
display:flex;
flex-direction:column;
gap:10px;
width:100%;
}

.title{
display:flex;
align-items:center;
gap:14px;
font-size:30px;
font-weight:900;
letter-spacing:1.5px;
background:linear-gradient(90deg,#ffd700,#ffb347,#fff2a8);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
text-shadow:0 0 14px rgba(255,215,0,.35)
}

.title img{
width:46px;
height:46px;
border-radius:50%;
object-fit:cover;
border:2px solid rgba(200,140,255,.6);
box-shadow:0 0 12px rgba(180,120,255,.8);
}

.stats{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
flex-wrap:wrap;
font-size:18px;
font-weight:700
}

.statbox{
display:flex;
align-items:center;
gap:6px;
padding:12px 16px;
border-radius:14px;
background:linear-gradient(145deg, rgba(30,20,70,.9), rgba(12,18,40,.9));
border:1px solid rgba(200,160,255,.5);
font-size:18px;
font-weight:800;
letter-spacing:.6px;
box-shadow:0 0 14px rgba(180,120,255,.35);
min-width:120px;
justify-content:center
}

.controls{
display:flex;
gap:8px
}

button{
border:none;
padding:8px 14px;
border-radius:10px;
background:linear-gradient(135deg,#c084ff,#2aff88);
color:#041018;
font-weight:700;
cursor:pointer;
box-shadow:0 0 15px rgba(180,120,255,.5);
font-size:13px
}

button:hover{transform:scale(1.05)}

.grid{
flex:1;
display:grid;
grid-template-columns:repeat(4,1fr);
grid-template-rows:repeat(4,1fr);
gap:14px
}

.card{
perspective:1000px;
cursor:pointer;
aspect-ratio:1/1;
width:100%;
border-radius:18px
}

.inner{
position:relative;
width:100%;
height:100%;
transition:transform .6s;
transform-style:preserve-3d
}

.card.flipped .inner{transform:rotateY(180deg)}

.front,.back{
position:absolute;
width:100%;
height:100%;
border-radius:18px;
backface-visibility:hidden;
display:flex;
justify-content:center;
align-items:center
}

.front{
background:linear-gradient(145deg,#1d0f3a,#0e1a3a);
border:1px solid rgba(180,120,255,.4);
box-shadow:
inset 0 0 20px rgba(180,120,255,.25),
0 0 25px rgba(120,255,200,.1)
}

.front img{
width:44px;
height:44px;
border-radius:50%;
object-fit:cover;
border:2px solid rgba(200,140,255,.5);
box-shadow:0 0 10px rgba(180,120,255,.9)
}

.back{
background:#0c1428;
transform:rotateY(180deg);
overflow:hidden;
border:1px solid rgba(120,255,200,.35)
}

.back img{
width:100%;
height:100%;
object-fit:cover
}

</style>
</head>
<body>

<div class="app" id="game">

<div class="header">

<div class="title">
<img src="https://i.postimg.cc/Hk74XW7t/bafybeiaan56tzg3lrk6wl5qdyfddnkhnjiv2bf26ewg23i26strzm7epzm.webp">
<span>ZORA CREATORS MEMORY CARDS</span>
</div>

<div class="stats">
<div class="statbox">Moves <span id="moves">0</span></div>
<div class="statbox">Matches <span id="matches">0</span>/8</div>

<div class="controls">
<button onclick="resetGame()">Reset</button>
</div>

</div>

</div>

<div class="grid" id="grid"></div>

</div>

<script>

const icon="https://i.postimg.cc/Hk74XW7t/bafybeiaan56tzg3lrk6wl5qdyfddnkhnjiv2bf26ewg23i26strzm7epzm.webp"

const images=[
"https://i.postimg.cc/HVnjbgf9/8Bitbase.webp",
"https://i.postimg.cc/7fhbSkp1/acryptocat.webp",
"https://i.postimg.cc/s1wvBX02/baseegg.webp",
"https://i.postimg.cc/K4JRKzst/batnater.webp",
"https://i.postimg.cc/XXQpZJDc/blindtrader.webp",
"https://i.postimg.cc/dL3DGYzT/blocksage.webp",
"https://i.postimg.cc/PPJN1jBZ/bubble101.webp",
"https://i.postimg.cc/KRj4t2dK/cajonosama.webp"
]

let deck=[]
let flipped=[]
let moves=0
let matches=0

function shuffle(a){
for(let i=a.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1));
[a[i],a[j]]=[a[j],a[i]]
}
return a
}

function init(){
const grid=document.getElementById("grid")
grid.innerHTML=""

moves=0
matches=0
flipped=[]

updateStats()

const pairs=[...images,...images]
deck=shuffle(pairs)

for(let i=0;i<16;i++){

const card=document.createElement("div")
card.className="card"
card.dataset.img=deck[i]

card.innerHTML=`
<div class="inner">
<div class="front"><img src="${icon}"></div>
<div class="back"><img src="${deck[i]}"></div>
</div>
`

card.onclick=()=>flip(card)

grid.appendChild(card)
}
}

function flip(card){

if(card.classList.contains("flipped"))return
if(flipped.length===2)return

card.classList.add("flipped")
flipped.push(card)

if(flipped.length===2){

moves++
updateStats()

let a=flipped[0].dataset.img
let b=flipped[1].dataset.img

if(a===b){

matches++
flipped=[]
updateStats()

if(matches===8){
setTimeout(()=>alert("Board Cleared ⚡"),300)
}

}else{

setTimeout(()=>{
flipped[0].classList.remove("flipped")
flipped[1].classList.remove("flipped")
flipped=[]
},800)

}

}
}

function updateStats(){
document.getElementById("moves").innerText=moves
document.getElementById("matches").innerText=matches
}

function resetGame(){init()}

init()

</script>

</body>
</html>
