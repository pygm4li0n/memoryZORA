<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meme Social Network // MSN</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <canvas id="particleCanvas"></canvas>

    <!-- Name Entry Overlay -->
    <div class="overlay-full" id="nameOverlay">
        <div class="overlay-card">
            <div class="profile-pic-upload">
                <div class="profile-pic-preview" id="profilePicPreview" title="Click to upload picture">
                    <span>📷</span>
                </div>
                <input type="file" id="profilePicInput" accept="image/*" style="display:none;">
                <span class="text-muted-small">Profile picture (optional)</span>
            </div>
            <h3>CREATE YOUR IDENTITY</h3>
            <input type="text" id="nameInput" placeholder="Your signature..." maxlength="30" autocomplete="off">
            <button class="btn-icon phantom-overlay-btn" id="phantomConnectBtnOverlay" title="Connect Phantom Wallet">
                <img src="https://i.postimg.cc/kXtLPZVF/Phanyoms2.png" alt="Phantom">
                <span>Connect Phantom</span>
            </button>
            <span class="wallet-address" id="walletAddressOverlay"></span>
            <button id="nameSubmitBtn">JOIN MEME SOCIAL NETWORK</button>
        </div>
    </div>

    <!-- Epic Request Overlay -->
    <div class="request-overlay hidden" id="requestOverlay">
        <div class="request-card">
            <div class="request-avatar" id="requestAvatar"></div>
            <div class="request-name" id="requestName"></div>
            <div class="request-buttons">
                <button class="btn-accept" id="requestAcceptBtn">✅ Accept</button>
                <button class="btn-decline" id="requestDeclineBtn">❌ Decline</button>
            </div>
        </div>
    </div>

    <!-- Mod Settings Overlay -->
    <div class="overlay-full hidden" id="modSettingsOverlay">
        <div class="overlay-card">
            <h3>⚙️ MOD SETTINGS</h3>
            <label for="modTokenRequirement">Required tokens to chat</label>
            <input type="number" id="modTokenRequirement" min="0" step="1000">
            <label for="modCooldownSelect">Cooldown between messages</label>
            <select id="modCooldownSelect">
                <option value="0">No cooldown</option>
                <option value="5">5 seconds</option>
                <option value="10">10 seconds</option>
                <option value="15">15 seconds</option>
            </select>
            <button id="modSaveSettingsBtn">SAVE SETTINGS</button>
            <button id="modCloseSettingsBtn">Close</button>
        </div>
    </div>

    <!-- No standalone sidebar toggle here anymore -->

    <div class="app-shell" id="appShell">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-user-profile-big" id="sidebarUserProfileBig">
                <div class="big-avatar" id="sidebarBigAvatar">?</div>
                <div class="big-info">
                    <div class="big-name" id="sidebarBigName">You</div>
                    <div class="big-rank hidden" id="sidebarBigRank"></div>
                    <div class="big-status"><span class="status-dot"></span> Online</div>
                </div>
                <button class="btn-icon edit-profile-btn" id="sidebarChangeNameBtn" title="Change name">✎</button>
            </div>

            <div class="sidebar-section-label">
                🔵 ACTIVE USERS <span class="active-users-count" id="sidebarActiveUsersCount">0</span>
            </div>
            <div class="sidebar-users" id="sidebarUsers">
                <div class="no-users-sidebar">No one else online</div>
            </div>
            <!-- Mobile-only token tracker inside sidebar -->
            <div class="token-tracker mobile-only" id="mobileTokenTracker">
                <img class="token-logo" id="mobileTokenLogo" src="" alt="logo">
                <span class="token-name" id="mobileTokenName">TOKEN</span>
                <span class="token-price" id="mobileTokenPrice">--</span>
                <span class="token-change" id="mobileTokenChange">--</span>
            </div>
            <div class="sidebar-footer">
                <span class="status-dot-sm" id="sidebarStatusDot"></span>
                <span id="sidebarStatusText">Connecting…</span>
            </div>
        </aside>

        <main class="chat-panel" id="chatPanel">
            <div class="chat-header-bar">
                <div class="header-left">
                    <!-- Sidebar toggle moved here, replaces old header icon -->
                    <button class="sidebar-toggle hidden" id="sidebarToggle" title="Users">☰</button>
                    <img src="https://i.postimg.cc/HWf8LcLQ/Proyecto-nuevo-(4)-(1).png" alt="Logo" class="header-logo">
                </div>

                <!-- NEW: center container for token tracker (big on desktop) -->
                <div class="header-center">
                    <div class="token-tracker" id="tokenTracker">
                        <img class="token-logo" id="tokenLogo" src="" alt="logo">
                        <span class="token-name" id="tokenName">TOKEN</span>
                        <span class="token-price" id="tokenPrice">--</span>
                        <span class="token-change" id="tokenChange">--</span>
                    </div>
                </div>

                <!-- Mobile centered logo (hidden on desktop) -->
                <img src="https://i.postimg.cc/HWf8LcLQ/Proyecto-nuevo-(4)-(1).png" alt="Logo" class="header-logo-mobile">

                <div class="header-right">
                    <span class="badge-pill" id="connectionPill">
                        <span id="connDot"></span>
                        <span id="connText" class="conn-text-full">Connecting…</span>
                    </span>
                    <span class="online-count-badge" id="onlineCountBadge">
                        <span class="dot"></span>
                        <span id="onlineCountNumber">0</span>
                    </span>
                    <!-- Phantom wallet button with image -->
                    <button class="btn-icon phantom-btn" id="phantomConnectBtn" title="Connect Phantom Wallet">
                        <img src="https://i.postimg.cc/kXtLPZVF/Phanyoms2.png" alt="Phantom">
                    </button>
                    <!-- Mobile edit profile button (hidden on desktop) -->
                    <button class="btn-icon mobile-edit-btn" id="mobileEditBtn" title="Edit profile">✎</button>
                    <span class="wallet-address" id="walletAddress"></span>
                    <button class="btn-icon hidden" id="modSettingsBtn" title="Mod Settings">⚙️</button>
                    <button class="btn-icon" id="refreshBtn" title="Reconnect"><span class="spin-icon">↻</span></button>
                </div>
            </div>
            <div class="chat-tabs" id="chatTabs">
                <div class="chat-tab active" data-tab="public">🌐 Public</div>
                <div class="chat-tab" data-tab="private">🔒 Private</div>
            </div>
            <div class="error-toast" id="errorToast"></div>
            <div class="typing-indicator" id="typingIndicator"></div>
            <div class="messages-container" id="publicMessagesContainer">
                <div class="empty-chat-hint" id="publicEmptyHint">No messages yet. Spark the conversation 💬</div>
            </div>
            <div class="messages-container hidden" id="privateMessagesContainer">
                <div class="empty-chat-hint" id="privateEmptyHint">No private messages with this user.</div>
            </div>
            <button class="scroll-bottom-btn" id="scrollBottomBtn" title="Scroll to bottom">↓</button>
            <div class="input-area-bar" id="inputAreaBar">
                <div class="reply-indicator-bar hidden" id="replyIndicatorBar">
                    <span>↳ Replying to <strong id="replyToUserDisp"></strong></span>
                    <img id="replyPreviewThumb" class="reply-preview-thumb hidden" src="" alt="thumb">
                    <span class="reply-preview-text" id="replyPreviewDisp"></span>
                    <button class="cancel-btn" id="cancelReplyBtn">✕</button>
                </div>
                <div class="private-indicator-bar hidden" id="privateIndicatorBar">
                    🔒 Private chat with <strong id="privateChatUserDisp"></strong>
                    <button class="cancel-btn" id="cancelPrivateBtn">✕ End</button>
                </div>
                <div class="image-preview-row hidden" id="imagePreviewRow">
                    <img class="image-preview-thumb" id="imagePreviewThumb" src="" alt="preview">
                    <span class="image-preview-name" id="imagePreviewName"></span>
                    <button class="image-preview-remove" id="imagePreviewRemove">✕</button>
                </div>
                <div id="cooldownIndicator" class="cooldown-indicator hidden"></div>
                <div class="input-row-wrap">
                    <input type="text" id="messageInput" placeholder="Type a message..." maxlength="500" autocomplete="off">
                    <button class="btn-upload-img" id="uploadImgBtn" title="Attach image (max 750px)">🖼</button>
                    <input type="file" id="fileInput" accept="image/*" style="display:none;">
                    <button class="send-btn-main" id="sendBtn">SEND</button>
                </div>
            </div>
        </main>
    </div>

    <div class="lightbox-overlay hidden" id="lightboxOverlay">
        <img id="lightboxImg" src="" alt="Enlarged image">
    </div>

    <!-- Solana Web3 and SPL Token libraries -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.js"></script>
    <script src="https://unpkg.com/@solana/spl-token@latest/lib/index.iife.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
